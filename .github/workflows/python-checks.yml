name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full local preflight
        run: python tools/run_full_preflight.py --json reports/full_preflight_report.json --markdown reports/full_preflight_report.md

      - name: Check publication manifest artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("reports/full_preflight_report.json"),
              Path("reports/full_preflight_report.md"),
              Path("reports/repository_manifest.json"),
              Path("reports/repository_manifest.md"),
          ]
          missing = [path.as_posix() for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f"missing or empty artifacts: {missing}")
          PY
